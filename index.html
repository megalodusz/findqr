<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Kódos Kalandtúra</title>
    <!-- QR kód olvasó könyvtár (Offline működéshez az első betöltés után) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Kalóztérkép háttér beállítása, amely kitölti a képernyőt és rögzített */
            background-image: url('map_backround.jpg');
            background-size: 200%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8);
        }
        .progress-container {
            width: 100%;
            max-width: 500px;
            /* Enyhén áttetsző pergament hatású fehér háttér az olvashatóságért */
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
            box-sizing: border-box;
            backdrop-filter: blur(2px);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        @media(max-width: 400px) {
            .grid { grid-template-columns: repeat(3, 70px); }
        }
        .badge {
            width: 100%;
            height: 60px;
            background-color: #e0e0e0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #7f8c8d;
            transition: all 0.3s ease;
            border: 1px solid #bdc3c7;
        }
        .badge span { font-size: 0.65rem; font-weight: normal; margin-top: 2px; }
        .badge.scanned { background-color: #f1c40f; color: white; border-color: #f39c12; }
        .badge.correct { background-color: #2ecc71; color: white; border-color: #27ae60; box-shadow: 0 4px 10px rgba(46,204,113,0.3); }
        .badge.skipped { background-color: #95a5a6; color: white; border-color: #7f8c8d; }

        /* ÓRIÁS KAMERA INDÍTÓ GOMB */
        .scan-trigger-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 22px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.5);
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .scan-trigger-btn:active { transform: scale(0.98); }
        .scan-trigger-btn:hover { background-color: #c0392b; }

        /* VÉGSŐ ÜZENET STÍLUSA A GOMB HELYÉN */
        .end-game-message {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            box-sizing: border-box;
            margin-bottom: 20px;
            animation: popIn 0.5s ease;
        }
        .end-message-success {
            background-color: #2ecc71;
            color: white;
            border: 2px solid #27ae60;
        }
        .end-message-incomplete {
            background-color: #34495e;
            color: white;
            border: 2px solid #2c3e50;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }

        /* Felugró ablak (Modal) stílusok */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal {
            background: rgba(255, 255, 255, 0.98); padding: 25px; border-radius: 15px;
            max-width: 420px; width: 85%; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center; animation: popIn 0.3s ease;
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .answer-input {
            width: 90%; padding: 12px; margin: 15px 0;
            border: 2px solid #bdc3c7; border-radius: 8px; font-size: 1rem; text-align: center;
        }
        .answer-input:focus { border-color: #3498db; outline: none; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn { padding: 14px; border: none; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-submit { background-color: #2ecc71; color: white; }
        .btn-skip { background-color: #e67e22; color: white; }
        .btn-close { background-color: #3498db; color: white; }

        .feedback { font-weight: bold; margin-top: 10px; font-size: 1.1rem; }
        .feedback.wrong { color: #e74c3c; }
        .feedback.good { color: #2ecc71; }
    </style>
</head>
<body>

    <h1>Kollégiumi Kalandtúra</h1>

    <div class="progress-container">
        <div>Megfejtett állomások: <span id="progress-text">0 / 12</span></div>
        <div class="grid" id="badge-grid"></div>
    </div>

    <!-- NAGY SCANNER GOMB -->
    <button class="scan-trigger-btn" id="start-btn" onclick="startScanner()">📷 QR KÓD BEOLVASÁSA</button>

    <!-- VÉGSŐ ÜZENET MEGJELENÍTŐ ZÓNA -->
    <div id="endGameZone" class="end-game-message"></div>

    <!-- Beágyazott kamera rész -->
    <div id="reader"></div>

    <!-- Felugró ablak (Modal) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">X. Állomás</h2>
            <p id="modalContent">Feladat szövege...</p>

            <div id="modal-interactive-zone">
                <input type="text" class="answer-input" id="answerInput" placeholder="Írd ide a választ...">
                <div class="feedback" id="feedbackMsg"></div>
                <div class="btn-group">
                    <button class="btn btn-submit" onclick="checkAnswer()">Válasz ellenőrzése</button>
                    <button class="btn btn-skip" onclick="skipTask()">Feladat átugrása</button>
                </div>
            </div>
            <div id="modal-close-zone" style="display:none;">
                <button class="btn btn-close" onclick="closeModal()">Bezárás</button>
            </div>
        </div>
    </div>

<script>
        // "Menj a klubba!" szóközök nélkül pontosan 12 karakter (M, e, n, j, a, k, l, u, b, b, a, !)
        const secretMessage = "Menjaklubba!";
        const totalTasks = 12;
        let html5QrCode;

        // Globális adatbázis a diák előrehaladásáról
        let gameState = {};
        for(let i = 1; i <= totalTasks; i++) {
            gameState[i] = { scanned: false, status: null, question: '', correctAnswer: '', studentAnswer: '' };
        }

        let currentActiveTask = null;

        // BEZÁRÁS ÉS ÚJRATÖLTÉS ELLENI VÉDELEM
        // Ha a diák bezárni, frissíteni vagy elhagyni akarja az oldalt, a böngésző kötelezően megerősítést kér tőle
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            // A modern böngészők biztonsági okokból saját rendszerszöveget jelenítenek meg, de a jóváhagyó ablakot kötelezően feldobják
            e.returnValue = 'Biztosan elhagyod az oldalt? Az eddigi játékmenet és a megszerzett betűk elvesznek!';
        });

        // UI rács kirajzolása dinamikusan
        const grid = document.getElementById('badge-grid');
        for (let i = 1; i <= totalTasks; i++) {
            const badge = document.createElement('div');
            badge.className = 'badge';
            badge.id = `badge-${i}`;
            badge.innerHTML = `${i}<span id="status-${i}">-</span>`;
            grid.appendChild(badge);
        }

        // Kamera indítása – KIZÁRÓLAG hátlapi kamerával
        function startScanner() {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('start-btn').style.display = 'none';

            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                alert("Nem sikerült elérni a hátlapi kamerát! Kérlek engedélyezd a böngésző beállításaiban.");
                document.getElementById('reader').style.display = 'none';
                document.getElementById('start-btn').style.display = 'block';
            });
        }

        // QR kód sikeres beolvasása
        function onScanSuccess(decodedText) {
            if (decodedText.startsWith("TASK_") && decodedText.includes("|")) {
                try {
                    const tokens = decodedText.split("|");
                    const taskNum = parseInt(tokens[0].split("_")[1]);
                    const question = tokens[1];
                    const answer = tokens[2];

                    if (taskNum >= 1 && taskNum <= totalTasks) {
                        html5QrCode.stop().then(() => {
                            document.getElementById('reader').style.display = 'none';
                            document.getElementById('start-btn').style.display = 'block';
                        });

                        currentActiveTask = taskNum;

                        if (gameState[taskNum].status !== 'correct') {
                            gameState[taskNum].scanned = true;
                            gameState[taskNum].question = question;
                            gameState[taskNum].correctAnswer = answer;

                            if(gameState[taskNum].status !== 'skipped') {
                                document.getElementById(`badge-${taskNum}`).className = 'badge scanned';
                                document.getElementById(`status-${taskNum}`).innerText = 'Megnyitva';
                            }
                        }

                        openModal(taskNum);
                    }
                } catch (e) {
                    alert("A QR kód szerkezete nem megfelelő a játékhoz!");
                }
            }
        }

        // Felugró ablak megnyitása
        function openModal(num) {
            const task = gameState[num];
            document.getElementById('modalTitle').innerText = `${num}. állomás feladata`;
            document.getElementById('modalContent').innerText = task.question;
            document.getElementById('feedbackMsg').innerText = '';
            document.getElementById('answerInput').value = task.studentAnswer;

            if (task.status === 'correct') {
                document.getElementById('modal-interactive-zone').style.display = 'none';
                document.getElementById('modal-close-zone').style.display = 'block';
                document.getElementById('feedbackMsg').className = 'feedback good';
                document.getElementById('feedbackMsg').innerText = `Ezt a feladatot már korábban sikeresen megoldottátok! (Megadott válasz: ${task.correctAnswer})`;
            } else {
                document.getElementById('modal-interactive-zone').style.display = 'block';
                document.getElementById('modal-close-zone').style.display = 'none';
            }

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        // Válasz ellenőrzése
        function checkAnswer() {
            const inputVal = document.getElementById('answerInput').value.trim().toLowerCase();
            const task = gameState[currentActiveTask];
            const realAnswer = task.correctAnswer.trim().toLowerCase();

            task.studentAnswer = document.getElementById('answerInput').value;

            if (inputVal === realAnswer) {
                task.status = 'correct';

                // Kiválasztjuk a titkos üzenet megfelelő betűjét (index = állomás - 1)
                const rewardedLetter = secretMessage[currentActiveTask - 1];

                // Frissítjük a jelvényt a megnyert betűvel
                const badge = document.getElementById(`badge-${currentActiveTask}`);
                badge.className = 'badge correct';
                badge.innerHTML = `${rewardedLetter}<span id="status-${currentActiveTask}">OK</span>`;

                document.getElementById('feedbackMsg').className = 'feedback good';
                document.getElementById('feedbackMsg').innerText = '🎉 Zseniális! A válasz helyes!';

                updateProgress();

                // AUTOMATIKUS BEZÁRÁS: 500ms után magától bezáródik a felugró ablak
                setTimeout(() => {
                    closeModal();
                    checkGameEnd(); // Bezárás után ellenőrizzük a játék végét
                }, 2000);

            } else {
                document.getElementById('feedbackMsg').className = 'feedback wrong';
                document.getElementById('feedbackMsg').innerText = '❌ Nem megfelelő válasz! Próbáld újra.';
            }
        }

        // Feladat átugrása
        function skipTask() {
            const task = gameState[currentActiveTask];
            task.status = 'skipped';

            if (!document.getElementById('answerInput').value.trim()) {
                task.studentAnswer = "[Nem adott meg választ]";
            } else {
                task.studentAnswer = document.getElementById('answerInput').value;
            }

            document.getElementById(`badge-${currentActiveTask}`).className = 'badge skipped';
            document.getElementById(`status-${currentActiveTask}`).innerText = 'Kihagyva';

            closeModal();
            updateProgress();
            checkGameEnd();
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        // Haladási pontok frissítése a fejlécben
        function updateProgress() {
            let scannedCount = 0;
            for (let i = 1; i <= totalTasks; i++) {
                if (gameState[i].scanned) scannedCount++;
            }
            document.getElementById('progress-text').innerText = `${scannedCount} / ${totalTasks}`;
        }

        // Játék végének ellenőrzése és a megfelelő üzenet kiírása a gomb helyén
        function checkGameEnd() {
            let completedCount = 0;
            let allCorrect = true;

            for (let i = 1; i <= totalTasks; i++) {
                if (gameState[i].status === 'correct' || gameState[i].status === 'skipped') {
                    completedCount++;
                }
                if (gameState[i].status !== 'correct') {
                    allCorrect = false;
                }
            }

            // Ha mind a 12 állomás lezárult valamilyen formában
            if (completedCount === totalTasks) {
                const startBtn = document.getElementById('start-btn');
                const endGameZone = document.getElementById('endGameZone');

                // Eltüntetjük a beolvasó gombot végleg
                startBtn.style.display = 'none';

                // Kiértékeljük a két lehetőséget
                if (allCorrect) {
                    endGameZone.className = "end-game-message end-message-success";
                    endGameZone.innerText = "Gratulálok, szép munka!";
                } else {
                    endGameZone.className = "end-game-message end-message-incomplete";
                    endGameZone.innerText = "Ügyes volt. Legközelebb még jobb lesz!";
                }

                // Megjelenítjük az üzenetet dobozt
                endGameZone.style.display = "block";
            }
        }
</script>
</body>
</html>
