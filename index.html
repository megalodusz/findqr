<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Kódos Kalandtúra</title>
    <!-- QR kód olvasó könyvtár (Offline működéshez az első betöltés után) -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        .progress-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        @media(max-width: 400px) {
            .grid { grid-template-columns: repeat(3, 70px); }
        }
        .badge {
            width: 100%;
            height: 60px;
            background-color: #e0e0e0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #7f8c8d;
            transition: all 0.3s ease;
        }
        .badge span { font-size: 0.65rem; font-weight: normal; margin-top: 2px; }
        .badge.scanned { background-color: #f1c40f; color: white; }
        .badge.correct { background-color: #2ecc71; color: white; box-shadow: 0 4px 10px rgba(46,204,113,0.3); }
        .badge.skipped { background-color: #95a5a6; color: white; }

        /* ÓRIÁS KAMERA INDÍTÓ GOMB */
        .scan-trigger-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 22px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .scan-trigger-btn:active { transform: scale(0.98); }
        .scan-trigger-btn:hover { background-color: #c0392b; }

        #reader {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        /* Felugró ablak (Modal) stílusok */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white; padding: 25px; border-radius: 15px;
            max-width: 420px; width: 85%; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center; animation: popIn 0.3s ease;
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .answer-input {
            width: 90%; padding: 12px; margin: 15px 0;
            border: 2px solid #bdc3c7; border-radius: 8px; font-size: 1rem; text-align: center;
        }
        .answer-input:focus { border-color: #3498db; outline: none; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn { padding: 14px; border: none; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-submit { background-color: #2ecc71; color: white; }
        .btn-skip { background-color: #e67e22; color: white; }
        .btn-close { background-color: #3498db; color: white; }
        
        .feedback { font-weight: bold; margin-top: 10px; font-size: 1.1rem; }
        .feedback.wrong { color: #e74c3c; }
        .feedback.good { color: #2ecc71; }
    </style>
</head>
<body>

    <h1>Kollégiumi Kalandtúra</h1>
    
    <div class="progress-container">
        <div>Beolvasott pontok: <span id="progress-text">0 / 12</span></div>
        <div class="grid" id="badge-grid"></div>
    </div>

    <!-- NAGY SCANNER GOMB -->
    <button class="scan-trigger-btn" id="start-btn" onclick="startScanner()">📷 QR KÓD BEOLVASÁSA</button>

    <!-- Beágyazott kamera rész -->
    <div id="reader"></div>

    <!-- Felugró ablak (Modal) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">X. Állomás</h2>
            <p id="modalContent">Feladat szövege...</p>
            
            <div id="modal-interactive-zone">
                <input type="text" class="answer-input" id="answerInput" placeholder="Írd ide a választ...">
                <div class="feedback" id="feedbackMsg"></div>
                <div class="btn-group">
                    <button class="btn btn-submit" onclick="checkAnswer()">Válasz ellenőrzése</button>
                    <button class="btn btn-skip" onclick="skipTask()">Feladat átugrása</button>
                </div>
            </div>
            <div id="modal-close-zone" style="display:none;">
                <button class="btn btn-close" onclick="closeModal()">Bezárás</button>
            </div>
        </div>
    </div>

<script>
        const totalTasks = 12;
        let html5QrCode;
        
        // A titkos felirat betűi sorrendben a 12 állomáshoz
        const secretLetters = {
            1: "M", 2: "e", 3: "n", 4: "j", 5: "a", 6: "k", 
            7: "l", 8: "u", 9: "b", 10: "b", 11: "a", 12: "!"
        };

        // Globális játékállapot (csak a státuszt és a QR-ból beolvasott adatokat menti)
        let gameState = JSON.parse(localStorage.getItem('kolesz_kaland_dynamic_state')) || {};
        
        if (Object.keys(gameState).length === 0) {
            for(let i = 1; i <= totalTasks; i++) {
                gameState[i] = { scanned: false, status: null, question: '', correctAnswer: '' };
            }
        }

        let currentActiveTask = null;

        // UI rács kirajzolása és frissítése
        const grid = document.getElementById('badge-grid');
        function renderGrid() {
            grid.innerHTML = '';
            for (let i = 1; i <= totalTasks; i++) {
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.id = `badge-${i}`;
                
                if (gameState[i].status === 'correct') {
                    badge.classList.add('correct');
                    badge.innerHTML = `${secretLetters[i]}<span>${i}. pont</span>`;
                } else if (gameState[i].status === 'skipped') {
                    badge.classList.add('skipped');
                    badge.innerHTML = `X<span>${i}. pont</span>`;
                } else if (gameState[i].scanned) {
                    badge.classList.add('scanned');
                    badge.innerHTML = `${i}<span>olvasva</span>`;
                } else {
                    badge.innerHTML = `${i}<span>-</span>`;
                }
                grid.appendChild(badge);
            }
            updateProgressText();
        }

        function updateProgressText() {
            let completed = 0;
            for (let i = 1; i <= totalTasks; i++) {
                if (gameState[i].status === 'correct' || gameState[i].status === 'skipped') {
                    completed++;
                }
            }
            document.getElementById('progress-text').textContent = `${completed} / ${totalTasks}`;
        }

        // Kamera indítása – KIZÁRÓLAG hátlapi kamerával
        function startScanner() {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('start-btn').textContent = "📷 KAMERA LEÁLLÍTÁSA";
            document.getElementById('start-btn').style.backgroundColor = "#7f8c8d";
            document.getElementById('start-btn').onclick = stopScanner;

            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                alert("Nem sikerült elindítani a kamerát: " + err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode = null;
                    resetScannerUI();
                }).catch(() => {
                    resetScannerUI();
                });
            } else {
                resetScannerUI();
            }
        }

        function resetScannerUI() {
            document.getElementById('reader').style.display = 'none';
            document.getElementById('start-btn').textContent = "📷 QR KÓD BEOLVASÁSA";
            document.getElementById('start-btn').style.backgroundColor = "#e74c3c";
            document.getElementById('start-btn').onclick = startScanner;
        }

        // Sikeres QR beolvasás kezelése (Azonnali kameraleállítással)
        function onScanSuccess(decodedText, decodedResult) {
            // AUTOMATIKUSAN KIKAPCSOLJA A KAMERÁT BEOLVASÁSKOR
            stopScanner(); 
            
            try {
                const url = new URL(decodedText);
                const stationId = parseInt(url.searchParams.get('station'));
                const question = url.searchParams.get('q');
                const answer = url.searchParams.get('a');
                
                if (stationId && stationId >= 1 && stationId <= totalTasks && question && answer) {
                    // Adatok mentése az állapotba a QR-kódból
                    gameState[stationId].scanned = true;
                    gameState[stationId].question = decodeURIComponent(question);
                    gameState[stationId].correctAnswer = decodeURIComponent(answer);
                    
                    saveState();
                    renderGrid();
                    openModal(stationId);
                } else {
                    alert("A QR-kód nem tartalmaz minden szükséges adatot (station, q, a)!");
                }
            } catch (e) {
                alert("A beolvasott kód nem egy érvényes feladat link!");
            }
        }

        // Felugró ablak kezelése
        function openModal(stationId) {
            currentActiveTask = stationId;
            const taskData = gameState[stationId];
            
            document.getElementById('modalTitle').textContent = `${stationId}. Állomás`;
            document.getElementById('modalContent').textContent = taskData.question;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedbackMsg').textContent = '';
            document.getElementById('feedbackMsg').className = 'feedback';
            
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            currentActiveTask = null;
        }

        // Válasz ellenőrzése
        function checkAnswer() {
            if (!currentActiveTask) return;
            
            const inputField = document.getElementById('answerInput');
            const studentAns = inputField.value.trim();
            const taskData = gameState[currentActiveTask];

            if (studentAns.toLowerCase() === taskData.correctAnswer.toLowerCase()) {
                gameState[currentActiveTask].status = 'correct';
                saveState();
                renderGrid();
                // AUTOMATIKUS BEZÁRÁS JÓ VÁLASZ ESETÉN
                closeModal();
            } else {
                const feedback = document.getElementById('feedbackMsg');
                feedback.textContent = "Sajnos a válasz helytelen, próbáld újra!";
                feedback.className = "feedback wrong";
            }
        }

        // Feladat átugrása
        function skipTask() {
            if (!currentActiveTask) return;
            
            gameState[currentActiveTask].status = 'skipped';
            saveState();
            renderGrid();
            closeModal();
        }

        function saveState() {
            localStorage.setItem('kolesz_kaland_dynamic_state', JSON.stringify(gameState));
        }

        // Indításkor az elmentett állás betöltése
        window.addEventListener('DOMContentLoaded', () => {
            renderGrid();
        });
    </script>
</body>
</html>
