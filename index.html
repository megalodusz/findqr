<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Kódos Kalandtúra</title>
    <!-- QR kód olvasó könyvtár (Offline működéshez az első betöltés után) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        .progress-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        @media(max-width: 400px) {
            .grid { grid-template-columns: repeat(3, 70px); }
        }
        .badge {
            width: 100%;
            height: 60px;
            background-color: #e0e0e0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #7f8c8d;
            transition: all 0.3s ease;
        }
        .badge span { font-size: 0.65rem; font-weight: normal; margin-top: 2px; }
        .badge.scanned { background-color: #f1c40f; color: white; }
        .badge.correct { background-color: #2ecc71; color: white; box-shadow: 0 4px 10px rgba(46,204,113,0.3); }
        .badge.skipped { background-color: #95a5a6; color: white; }

        /* ÓRIÁS KAMERA INDÍTÓ GOMB */
        .scan-trigger-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 22px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .scan-trigger-btn:active { transform: scale(0.98); }
        .scan-trigger-btn:hover { background-color: #c0392b; }

        #reader {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        /* Felugró ablak (Modal) stílusok */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white; padding: 25px; border-radius: 15px;
            max-width: 420px; width: 85%; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center; animation: popIn 0.3s ease;
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .answer-input {
            width: 90%; padding: 12px; margin: 15px 0;
            border: 2px solid #bdc3c7; border-radius: 8px; font-size: 1rem; text-align: center;
        }
        .answer-input:focus { border-color: #3498db; outline: none; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn { padding: 14px; border: none; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-submit { background-color: #2ecc71; color: white; }
        .btn-skip { background-color: #e67e22; color: white; }
        .btn-close { background-color: #3498db; color: white; }
        
        .feedback { font-weight: bold; margin-top: 10px; font-size: 1.1rem; }
        .feedback.wrong { color: #e74c3c; }
        .feedback.good { color: #2ecc71; }
        
        /* Az összesítés doboz stílusai eltávolítva */
    </style>
</head>
<body>

    <h1>QR Kódos Kalandtúra</h1>
    
    <div class="progress-container">
        <div><strong>Haladás: <span id="progress-text">0 / 12</span> állomás</strong></div>
        <div class="grid" id="badge-grid">
            <!-- A jelvényeket a JavaScript generálja -->
        </div>
    </div>

    <button class="scan-trigger-btn" id="start-scan-btn">Kamera Indítása</button>
    <div id="reader"></div>

    <!-- Feladat panel (Modal) -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">Állomás</h2>
            <p id="modal-question">Betöltés...</p>
            <input type="text" class="answer-input" id="answer-input" placeholder="Írd ide a választ...">
            <div id="feedback" class="feedback"></div>
            <div class="btn-group">
                <button class="btn btn-submit" id="submit-btn">Beküldés</button>
                <button class="btn btn-skip" id="skip-btn">Kihagyás</button>
                <button class="btn btn-close" id="close-btn">Bezárás</button>
            </div>
        </div>
    </div>

<script>
        // 12 állomás feladatai és a "Menjaklubba!" betűi sorrendben
        const stations = [
            { id: 1, letter: "M", question: "Első állomás kérdése? (M)", answer: "helyes" },
            { id: 2, letter: "e", question: "Második állomás kérdése? (e)", answer: "helyes" },
            { id: 3, letter: "n", question: "Harmadik állomás kérdése? (n)", answer: "helyes" },
            { id: 4, letter: "j", question: "Negyedik állomás kérdése? (j)", answer: "helyes" },
            { id: 5, letter: "a", question: "Ötödik állomás kérdése? (a)", answer: "helyes" },
            { id: 6, letter: "k", question: "Hatodik állomás kérdése? (k)", answer: "helyes" },
            { id: 7, letter: "l", question: "Hetedik állomás kérdése? (l)", answer: "helyes" },
            { id: 8, letter: "u", question: "Nyolcadik állomás kérdése? (u)", answer: "helyes" },
            { id: 9, letter: "b", question: "Kilencedik állomás kérdése? (b)", answer: "helyes" },
            { id: 10, letter: "b", question: "Tizedik állomás kérdése? (b)", answer: "helyes" },
            { id: 11, letter: "a", question: "Tizenegyedik állomás kérdése? (a)", answer: "helyes" },
            { id: 12, letter: "!", question: "Tizenkettedik állomás kérdése? (!)", answer: "helyes" }
        ];

        // Állapot mentése (LocalStorage az offline/újratöltés elleni védelemhez)
        let userProgress = JSON.parse(localStorage.getItem('qr_tour_progress')) || {};
        let currentStationId = null;
        let html5QrcodeScanner = null;

        const badgeGrid = document.getElementById('badge-grid');
        const progressText = document.getElementById('progress-text');
        const startScanBtn = document.getElementById('start-scan-btn');
        const readerDiv = document.getElementById('reader');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalQuestion = document.getElementById('modal-question');
        const answerInput = document.getElementById('answer-input');
        const feedbackDiv = document.getElementById('feedback');
        
        const submitBtn = document.getElementById('submit-btn');
        const skipBtn = document.getElementById('skip-btn');
        const closeBtn = document.getElementById('close-btn');

        // Jelvény rács inicializálása
        function initBadges() {
            badgeGrid.innerHTML = '';
            stations.forEach(st => {
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.id = `badge-${st.id}`;
                
                // Ha már helyesen megválaszolta, a kapott betűt jelenítjük meg
                if (userProgress[st.id] === 'correct') {
                    badge.classList.add('correct');
                    badge.innerHTML = `${st.letter}<span>${st.id}. állomás</span>`;
                } else if (userProgress[st.id] === 'skipped') {
                    badge.classList.add('skipped');
                    badge.innerHTML = `X<span>${st.id}. állomás</span>`;
                } else {
                    badge.innerHTML = `${st.id}<span>állomás</span>`;
                }
                badgeGrid.appendChild(badge);
            });
            updateProgressCount();
        }

        function updateProgressCount() {
            const completed = Object.keys(userProgress).length;
            progressText.textContent = `${completed} / ${stations.length}`;
        }

        // QR kód beolvasás kezelése
        startScanBtn.addEventListener('click', () => {
            if (readerDiv.style.display === 'block') {
                stopScanner();
            } else {
                startScanner();
            }
        });

        function startScanner() {
            readerDiv.style.display = 'block';
            startScanBtn.textContent = 'Kamera Leállítása';
            startScanBtn.style.backgroundColor = '#7f8c8d';

            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // QR kód sikeres beolvasása. Elvárt URL formátum pl: https://domain.com
                    stopScanner();
                    try {
                        const url = new URL(decodedText);
                        const stationId = parseInt(url.searchParams.get('station'));
                        if (stationId && stations.some(s => s.id === stationId)) {
                            openStationModal(stationId);
                        } else {
                            alert('Érvénytelen QR kód ehhez a túrához!');
                        }
                    } catch (e) {
                        alert('Nem megfelelő QR kód formátum!');
                    }
                },
                (errorMessage) => { /* folyamatos olvasási log elnyomása */ }
            ).catch(err => {
                alert("Nem sikerült elérni a kamerát: " + err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner = null;
                    resetScannerUI();
                }).catch(() => {
                    resetScannerUI();
                });
            } else {
                resetScannerUI();
            }
        }

        function resetScannerUI() {
            readerDiv.style.display = 'none';
            startScanBtn.textContent = 'Kamera Indítása';
            startScanBtn.style.backgroundColor = '#e74c3c';
        }

        // Feladat ablak megnyitása
        function openStationModal(id) {
            currentStationId = id;
            const station = stations.find(s => s.id === id);
            
            modalTitle.textContent = `${id}. Állomás`;
            modalQuestion.textContent = station.question;
            answerInput.value = '';
            answerInput.style.display = 'block';
            feedbackDiv.textContent = '';
            feedbackDiv.className = 'feedback';
            
            // Ha már korábban válaszolt rá, töltsük be az állapotot jelzésként
            if (userProgress[id] === 'correct') {
                feedbackDiv.textContent = `Ezt már sikeresen megoldottad! Betűd: ${station.letter}`;
                feedbackDiv.classList.add('good');
            }

            modalOverlay.style.display = 'flex';
        }

        // Feladat ablak bezárása
        function closeModal() {
            modalOverlay.style.display = 'none';
            currentStationId = null;
        }

        // Válasz beküldése
        submitBtn.addEventListener('click', () => {
            if (!currentStationId) return;
            
            const station = stations.find(s => s.id === currentStationId);
            const userAns = answerInput.value.trim().toLowerCase();
            
            if (userAns === station.answer.toLowerCase()) {
                // Mentés és vizuális frissítés
                userProgress[currentStationId] = 'correct';
                localStorage.setItem('qr_tour_progress', JSON.stringify(userProgress));
                
                const badge = document.getElementById(`badge-${currentStationId}`);
                badge.className = 'badge correct';
                badge.innerHTML = `${station.letter}<span>${station.stationId || currentStationId}. állomás</span>`;
                
                updateProgressCount();
                
                // AUTOMATIKUS BEZÁRÁS JÓ VÁLASZ ESETÉN
                closeModal();
            } else {
                feedbackDiv.textContent = "Sajnos nem jó válasz, próbáld újra!";
                feedbackDiv.className = "feedback wrong";
            }
        });

        // Állomás kihagyása
        skipBtn.addEventListener('click', () => {
            if (!currentStationId) return;
            
            userProgress[currentStationId] = 'skipped';
            localStorage.setItem('qr_tour_progress', JSON.stringify(userProgress));
            
            const badge = document.getElementById(`badge-${currentStationId}`);
            badge.className = 'badge skipped';
            badge.innerHTML = `X<span>${currentStationId}. állomás</span>`;
            
            updateProgressCount();
            closeModal();
        });

        closeBtn.addEventListener('click', closeModal);

        // Alkalmazás indítása
        window.addEventListener('DOMContentLoaded', initBadges);
    </script>
</body>
</html>
